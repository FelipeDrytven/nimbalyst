name: Build Nimbalyst Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '300000'

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace dependencies
        run: npm run build:workspace-deps

      - name: Build transcript bundle
        run: npm run android:build:transcript

      - name: Build editor bundle
        run: npm run build:editor --prefix packages/android

      - name: Build debug APK
        working-directory: packages/android
        run: ./gradlew :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: nimbalyst-android-debug-apk
          path: packages/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
